[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unmount-doctor"
version = "0.1.0"
description = "Explain which process is holding a Linux mount point/path busy, and why."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "zhuhroscar-tech" }]
keywords = ["linux", "umount", "fuser", "lsof", "mount", "cli", "sysadmin"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/unmount-doctor"
Issues = "https://github.com/zhuhroscar-tech/unmount-doctor/issues"

[project.scripts]
unmount-doctor = "unmount_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
